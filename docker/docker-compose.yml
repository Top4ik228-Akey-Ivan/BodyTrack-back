services:
  postgres:
    image: postgres:15
    container_name: bodytrack_db
    environment:
      POSTGRES_DB: bodytrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bodytrack_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bodytrack_network:
    driver: bridge